<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Signal Lost | RipoN Sahaji</title>
  <meta name="description" content="Coordinates lost in deep space. Return to orbit.">
  <meta name="theme-color" content="#040714">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at center, #070c1e 0%, #040714 80%);
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .error-container {
      max-width: 580px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .error-code-badge {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.22em;
      color: var(--cyan);
      background: rgba(0, 242, 254, 0.08);
      border: 1px solid rgba(0, 242, 254, 0.3);
      padding: 0.35rem 1.1rem;
      border-radius: 999px;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .error-title {
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: #ffffff;
    }

    .error-desc {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="ambient-vignette" aria-hidden="true"></div>

  <main class="error-container">
    <div class="error-code-badge">
      <span class="pulse-beacon"></span>
      <span>COORDINATES LOST · 404</span>
    </div>

    <h1 class="error-title">
      This Page<br>
      <span class="glow-text">Never Ranked</span>
    </h1>

    <p class="error-desc">
      The URL you navigated to does not exist in this sector. The coordinates were lost in deep space, but the signal remains alive.
    </p>

    <div style="margin-top: 0.5rem;">
      <a class="btn-primary" href="/" style="text-decoration: none;">
        <span>Return to Orbit</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      </a>
    </div>
  </main>
</body>

</html>
